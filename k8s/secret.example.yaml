apiVersion: v1
kind: Secret
metadata:
  name: argus-echo-secrets
  namespace: argus-echo
type: Opaque
stringData:
  GROQ_API_KEY: your_groq_api_key_here
  BOLNA_API_KEY: your_bolna_api_key_here
  BOLNA_AGENT_ID: your_bolna_agent_id_here
  ARGUS_VOICEOPS_API_TOKEN: replace_with_a_long_random_secret
  ARGUS_BOLNA_WEBHOOK_TOKEN: replace_with_a_different_long_random_secret
