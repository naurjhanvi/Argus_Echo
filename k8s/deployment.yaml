apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: argus-echo-storage
  namespace: argus-echo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-echo
  namespace: argus-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argus-echo
  template:
    metadata:
      labels:
        app: argus-echo
    spec:
      containers:
        - name: argus-echo
          image: us-central1-docker.pkg.dev/argus-echo/argus-echo/argus-echo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
            - containerPort: 8000
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: argus-echo-secrets
                  key: GROQ_API_KEY
            - name: BOLNA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: argus-echo-secrets
                  key: BOLNA_API_KEY
            - name: BOLNA_AGENT_ID
              valueFrom:
                secretKeyRef:
                  name: argus-echo-secrets
                  key: BOLNA_AGENT_ID
            - name: ARGUS_VOICEOPS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: argus-echo-secrets
                  key: ARGUS_VOICEOPS_API_TOKEN
            - name: ARGUS_BOLNA_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: argus-echo-secrets
                  key: ARGUS_BOLNA_WEBHOOK_TOKEN
            - name: ARGUS_STORAGE_DIR
              value: /app/ml
            - name: ARGUS_DB_PATH
              value: /app/ml/argus_echo.db
            - name: ARGUS_VOICEOPS_API_URL
              value: https://argus.example.com
            - name: ARGUS_UI_ORIGINS
              value: https://argus.example.com
            - name: ARGUS_SQLITE_TIMEOUT_SECONDS
              value: "30"
            - name: ARGUS_MAX_TRAINING_ROWS
              value: "20000"
            - name: ARGUS_MAX_DIAGNOSTIC_ROWS
              value: "20000"
          volumeMounts:
            - name: argus-echo-storage
              mountPath: /app/ml
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
              ephemeral-storage: "2Gi"
            limits:
              cpu: "1"
              memory: "3Gi"
              ephemeral-storage: "3Gi"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: argus-echo-storage
          persistentVolumeClaim:
            claimName: argus-echo-storage
